language: python
dist: jammy

matrix:
  include:
    - python: 3.9
      env:
        - TOX_ENV=py39
    - python: 3.10
      env:
        - TOX_ENV=py310
    - python: 3.12
      env:
        - TOX_ENV=py312
    - python: 3.13
      env:
        - TOX_ENV=py313
    - python: 3.14
      env:
        - TOX_ENV=py314
    - python: 3.10
      env:
        - TOX_ENV=pep8

install:
  - pip install tox

script:
  - tox -e $TOX_ENV
