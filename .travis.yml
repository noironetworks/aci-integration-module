language: python
dist: jammy

matrix:
  include:
    - python: 3.9
      env:
        - TOX_ENV=py39
    - python: 3.10
      env:
        - TOX_ENV=py310
    - python: 3.12
      env:
        - TOX_ENV=py312
    - python: 3.10
      env:
        - TOX_ENV=pep8
    - python: 3.10
      env:
        - TOX_ENV=cover

install:
  - pip install tox

script:
  - travis_wait 15 tox -e $TOX_ENV
